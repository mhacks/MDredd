name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Sync and import
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.8.22"
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Import the app
        env:
          MDREDD_API_TOKEN: ci-token-not-a-real-secret-0123456789
        run: uv run python -c "import app.main"
