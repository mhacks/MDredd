[project]
name = "mdredd"
version = "0.1.0"
description = "A realistic pair-wise judging algorithm API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.129.0",
    "jax>=0.9.0.1",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "peewee>=4.5.1",
    "pydantic-settings>=2.13.0",
    "strawberry-graphql[fastapi]>=0.327.7",
]

[tool.basedpyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
]
