services:
  api:
    build: .
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "8000:8000"
    environment:
      MDREDD_DB_FILE: /app/data/mdredd.db
      MDREDD_API_TOKEN: ${MDREDD_API_TOKEN:?MDREDD_API_TOKEN must be set}
      MDREDD_CORS_ORIGINS: ${MDREDD_CORS_ORIGINS:-["http://localhost:8000"]}
    volumes:
      # A named volume starts out owned by the image's unprivileged user.
      - mdredd-data:/app/data

volumes:
  mdredd-data: