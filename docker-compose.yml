services:
  api:
    build: .
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "8000:8000"
    environment:
      - MDREDD_DB_FILE=/app/data/mdredd.db
    volumes:
      - ./data:/app/data